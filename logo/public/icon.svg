<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="globeShade" cx="38%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1e3d68"/>
      <stop offset="55%" stop-color="#132846"/>
      <stop offset="100%" stop-color="#0c1830"/>
    </radialGradient>
    <clipPath id="globeClip">
      <circle cx="29" cy="36" r="21"/>
    </clipPath>
  </defs>

  <!-- App background -->
  <rect width="64" height="64" rx="14" fill="#0b0e17"/>

  <!-- Atmosphere glow -->
  <circle cx="29" cy="36" r="23.5" fill="none" stroke="#3a6ea5" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Globe -->
  <circle cx="29" cy="36" r="21" fill="url(#globeShade)" stroke="#3a6ea5" stroke-width="1.4"/>

  <!-- Graticule -->
  <g clip-path="url(#globeClip)" stroke="#7f9cc0" stroke-opacity="0.35" stroke-width="1" fill="none">
    <ellipse cx="29" cy="36" rx="8" ry="21"/>
    <ellipse cx="29" cy="36" rx="16" ry="21"/>
    <ellipse cx="29" cy="27" rx="20" ry="5"/>
    <ellipse cx="29" cy="36" rx="21" ry="6"/>
    <ellipse cx="29" cy="45" rx="20" ry="5"/>
  </g>

  <!-- Minor quakes -->
  <circle cx="19" cy="44" r="2.2" fill="#2ecc71"/>
  <circle cx="33" cy="49" r="2.2" fill="#f1c40f"/>

  <!-- Epicenter with propagating waves -->
  <circle cx="42" cy="22" r="3.4" fill="#e74c3c"/>
  <circle cx="42" cy="22" r="7.5" fill="none" stroke="#e74c3c" stroke-opacity="0.75" stroke-width="2"/>
  <circle cx="42" cy="22" r="12" fill="none" stroke="#e67e22" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="42" cy="22" r="16.5" fill="none" stroke="#f1c40f" stroke-opacity="0.25" stroke-width="2"/>
</svg>
